name: Rapikan pesanan kedaluwarsa

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil /api/cron/expire-orders
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$SITE_URL" && test -n "$CRON_SECRET"
          curl --fail --silent --show-error --max-time 30 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/expire-orders"
